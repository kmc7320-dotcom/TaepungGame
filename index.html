<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐾 태풍이랑 친구들의 퍼즐게임  🐾</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 배경 음악 플레이어 -->
    <audio id="bgm-audio" loop>
        <source src="music/강아지_꼬리흔들_초경쾌_멜로디.wav" type="audio/wav">
    </audio>

    <div class="game-box">
        <!-- 로비 화면 -->
        <div id="arcade-lobby" class="screen active">
            <h2>🐾Puzzle Game 🐾</h2>
            <p class="story-text">
                퍼즐 모드를 선택해 주세요!<br> 킬링타임🦴
            </p>
            <div class="arcade-buttons">
                <button class="start-btn mode-btn" onclick="openNormalPuzzleMenu()">🧩 아주 쉽죠잉</button>
                <button class="start-btn mode-btn" onclick="openRandomPuzzleMenu()">🎲 돌아삐쥬 어렵쥬</button>
            </div>
        </div>

        <!-- 1번 모드: 사진 선택 및 일반 퍼즐 화면 -->
        <div id="normal-puzzle-screen" class="screen">
            <h2>🧩 조각 퍼즐</h2>
            <div id="normal-select-menu">
                <p>✨ 원하시는 사진을 선택해 주세요!</p>
                <div class="photo-grid">
                    <button onclick="startNormalPuzzle('1.jpg')" class="photo-btn">강태풍</button>
                    <button onclick="startNormalPuzzle('2.jpg')" class="photo-btn">쿠크</button>
                    <button onclick="startNormalPuzzle('3.jpg')" class="photo-btn">그레이블랙</button>
                    <button onclick="startNormalPuzzle('4.jpg')" class="photo-btn">하루</button>
                    <button onclick="startNormalPuzzle('5.jpg')" class="photo-btn">하이링</button>
                    <button onclick="startNormalPuzzle('6.jpg')" class="photo-btn">하이</button>
                    <button onclick="startNormalPuzzle('7.jpg')" class="photo-btn">오션</button>
                    <button onclick="startNormalPuzzle('8.jpg')" class="photo-btn">카이</button>
                    <button onclick="startNormalPuzzle('9.jpg')" class="photo-btn">시온</button>
                    <button onclick="startNormalPuzzle('10.jpg')" class="photo-btn">보름달토끼</button>
                    <button onclick="startNormalPuzzle('11.jpg')" class="photo-btn">감자</button>
                    <button onclick="startNormalPuzzle('12.jpg')" class="photo-btn">율무</button>
                    <button onclick="startNormalPuzzle('13.jpg')" class="photo-btn">가비치치</button>
                    <button onclick="startNormalPuzzle('14.jpg')" class="photo-btn">티나쏠티</button>
                    <button onclick="startNormalPuzzle('15.jpg')" class="photo-btn">뚜시</button>
                    <button onclick="startNormalPuzzle('16.jpg')" class="photo-btn">루이시아</button>
                    <button onclick="startNormalPuzzle('17.jpg')" class="photo-btn">바벨로우</button>
                    <button onclick="startNormalPuzzle('18.jpg')" class="photo-btn">베니</button>
                    <button onclick="startNormalPuzzle('19.jpg')" class="photo-btn">쩜메이</button>
                    <button onclick="startNormalPuzzle('20.jpg')" class="photo-btn">태풍쿠크페리</button>
                    <button onclick="startNormalPuzzle('21.jpg')" class="photo-btn">하쿠</button>
                    <button onclick="startNormalPuzzle('22.jpg')" class="photo-btn">호진탐</button>
                    <button onclick="startNormalPuzzle('23.jpg')" class="photo-btn">흑곰</button>
                    <button onclick="startNormalPuzzle('24.jpg')" class="photo-btn">태풍</button>
                    <button onclick="startNormalPuzzle('25.jpg')" class="photo-btn">태풍</button>
                    <button onclick="startNormalPuzzle('26.jpg')" class="photo-btn">태풍</button>
                    <button onclick="startNormalPuzzle('27.jpg')" class="photo-btn">태풍</button>
                    <button onclick="startNormalPuzzle('28.jpg')" class="photo-btn">태풍</button>
                    <button onclick="startNormalPuzzle('29.jpg')" class="photo-btn">태풍</button>
                    <button onclick="startNormalPuzzle('30.jpg')" class="photo-btn">태풍</button>
                    <button onclick="startNormalPuzzle('31.jpg')" class="photo-btn">태풍</button>
                    <button onclick="startNormalPuzzle('32.jpg')" class="photo-btn">태풍</button>
                    <button onclick="startNormalPuzzle('33.jpg')" class="photo-btn">태풍</button>
                    <button onclick="startNormalPuzzle('34.jpg')" class="photo-btn">태풍</button>
                    <button onclick="startNormalPuzzle('35.jpg')" class="photo-btn">보리</button>

                </div>
            </div> 

            <div id="normal-game-area" style="display: none;">
                <p class="puzzle-instruction">조각을 두 개씩 클릭하여 자리를 바꿔보세요!</p>
                <div class="puzzle-flex-container">
                    <div class="original-box">
                        <p>📸 원본 사진</p>
                        <img id="normal-original-img" src="" alt="원본 사진">
                    </div>
                    <div id="normal-puzzle-board" class="puzzle-board"></div>
                </div>
                <p id="normal-puzzle-status" class="puzzle-status"></p>
                <button onclick="backToNormalMenu()" class="action-btn">🖼️ 다른 사진 고르기</button>
            </div>
            
            <button onclick="goLobby()" class="lobby-btn">🏠 로비로 돌아가기</button>
        </div>

        <!-- 2번 모드: 단일 폴더 랜덤 연속 퍼즐 화면 -->
        <div id="random-puzzle-screen" class="screen">
            <h2>🎲 랜덤 GAME</h2>
            <div id="random-select-menu">
                <p>✨ 난이도를 선택하고 게임을 시작하세요!</p>
                
                <div class="difficulty-select">
                    <label><input type="radio" name="random-diff" value="6" checked> 6 x 6 (36조각)</label>
                    <label style="margin-left: 20px;"><input type="radio" name="random-diff" value="12"> 12 x 12 (144조각)</label>
                </div>
                <br>
                <button onclick="startRandomGame()" class="start-btn mode-btn" style="background: #28a745; color: white;">🚀 퍼즐 시작하기</button>
            </div>

            <div id="random-game-area" style="display: none;">
                <p class="puzzle-instruction">성공하면 자동으로 다음 사진으로 넘어갑니다!</p>
                <div class="puzzle-flex-container">
                    <div class="original-box">
                        <p>📸 원본 사진</p>
                        <img id="random-original-img" src="" alt="원본 사진">
                    </div>
                    <div id="random-puzzle-board" class="puzzle-board"></div>
                </div>
                <p id="random-puzzle-status" class="puzzle-status"></p>
                <div style="margin-top: 10px;">
                    <button id="next-random-btn" onclick="loadNextRandomPhoto()" class="action-btn" style="display: none; background: #28a745;">✨ 다음 사진으로 넘어가기</button>
                    <button onclick="backToRandomMenu()" class="action-btn" style="background: #17a2b8;">⚙️ 난이도 재선택</button>
                </div>
            </div>

            <button onclick="goLobby()" class="lobby-btn">🏠 로비로 돌아가기</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
