<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>태풍이와 친구들의 아케이드 랜드 🐾</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-box">
        <!-- 아케이드 메인 선택 화면 (가운데 정렬 스타일) -->
        <div id="arcade-lobby" style="text-align: center; padding-top: 40px;">
            <h2>🐾 태풍이와 친구들의 아케이드 랜드 🐾</h2>
            <p class="story-text" style="margin: 15px 0; color: #555;">
                원하는 놀이를 선택해 주세요!<br> 즐거운 시간을 보내봐요 🦴
            </p>
            <div class="arcade-buttons" style="display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 20px;">
                <button class="start-btn" onclick="startRunningGame()" style="padding: 12px 24px; font-size: 16px; background: #4caf50; color: white; border: none; border-radius: 8px; cursor: pointer; width: 260px;">🏃‍♂️ 태풍이 뛰어놀기 (어질리티)</button>
                <button class="start-btn" onclick="openPuzzleMenu()" style="padding: 12px 24px; font-size: 16px; background-color: #ffc107; color: #333; border: none; border-radius: 8px; cursor: pointer; width: 260px; font-weight: bold;">🧩 태풍이랑 친구들 사진 퍼즐</button>
            </div>
        </div>

        <!-- 1. 뛰어놀기 게임 플레이 화면 -->
        <div id="play-screen" style="display: none;">
            <h2 id="taepung-dialog">안녕! 난 강태풍이야 🐾</h2>
            <div class="score-board">
                <p>🥏 원반 던지기: <span id="frisbee-count">0</span> / 5</p>
                <p>🎾 공놀이: <span id="ball-count">0</span> / 3</p>
                <h3 id="heart-status">획득한 하트: 🤍 🤍</h3>
            </div>
            
            <div style="text-align: center;">
                <canvas id="gameCanvas" width="400" height="200" style="max-width: 100%; height: auto; border: 2px solid #ccc; border-radius: 8px; background: #e8f5e9;"></canvas>
            </div>

            <div id="stage-1-panel" class="action-buttons" style="margin-top: 15px; text-align: center;">
                <button onclick="throwFrisbee()" style="padding: 10px 15px; background: #ff9800; color: white; border: none; border-radius: 5px; cursor: pointer;">🥏 원반 던지기</button>
                <button onclick="throwBall()" style="padding: 10px 15px; background: #e91e63; color: white; border: none; border-radius: 5px; cursor: pointer; margin-left: 5px;">🎾 공놀이 하기</button>
            </div>

            <div id="stage-2-panel" class="action-buttons" style="display: none; margin-top: 15px; text-align: center;">
                <button onclick="jumpButtonAction()" style="background-color: #28a745; color: white; font-size: 16px; padding: 12px 24px; border: none; border-radius: 5px; cursor: pointer;">
                    🚧 태풍이 점프하기! (성공: <span id="hurdle-count">0</span>/3)
                </button>
            </div>

            <div id="stage-3-panel" style="display: none; margin-top: 15px; text-align: center;">
                <p style="font-weight: bold; color: #333; margin-bottom: 8px;">✨ 함께 놀 친구를 선택해 주세요!</p>
                <div class="friend-grid" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 5px;">
                    <button onclick="selectFriend('쿠크')" style="padding: 6px 10px; cursor: pointer;">🐶 쿠크</button>
                    <button onclick="selectFriend('페리')" style="padding: 6px 10px; cursor: pointer;">🐕 페리</button>
                    <button onclick="selectFriend('그레이')" style="padding: 6px 10px; cursor: pointer;">🐾 그레이</button>
                    <button onclick="selectFriend('블랙')" style="padding: 6px 10px; cursor: pointer;">🐾 블랙</button>
                    <button onclick="selectFriend('시온')" style="padding: 6px 10px; cursor: pointer;">🎾 시온</button>
                    <button onclick="selectFriend('오셔니')" style="padding: 6px 10px; cursor: pointer;">🌊 오셔니</button>
                    <button onclick="selectFriend('보름이')" style="padding: 6px 10px; cursor: pointer;">🌕 보름이</button>
                    <button onclick="selectFriend('링')" style="padding: 6px 10px; cursor: pointer;">링</button>
                    <button onclick="selectFriend('하루')" style="padding: 6px 10px; cursor: pointer;">하루</button>
                    <button onclick="selectFriend('까미')" style="padding: 6px 10px; cursor: pointer;">까미</button>
                    <button onclick="selectFriend('복실이')" style="padding: 6px 10px; cursor: pointer;">복실이</button>
                </div>
            </div>

            <div style="text-align: center; margin-top: 15px;">
                <button onclick="goLobby()" style="background: #6c757d; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">🏠 로비로 돌아가기</button>
            </div>
        </div>

        <!-- 2. 조각 퍼즐 게임 화면 -->
        <div id="puzzle-screen" style="display: none; text-align: center;">
            <h2>🧩 태풍이와 친구들 조각 퍼즐 맞추기</h2>
            <p>조각을 클릭해 자리를 바꾸며 그림을 완성해 보세요!</p>
            
            <!-- 사진 선택 메뉴 -->
            <div id="puzzle-select-menu">
                <p>퍼즐로 맞출 태풍이랑 친구들 사진을 선택해 주세요! (1~22번)</p>
                <div class="photo-grid" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 15px 0;">
                    <button onclick="startPuzzleWithPhoto('1.jpg')" class="photo-btn">사진 1</button>
                    <button onclick="startPuzzleWithPhoto('2.jpg')" class="photo-btn">사진 2</button>
                    <button onclick="startPuzzleWithPhoto('3.jpg')" class="photo-btn">사진 3</button>
                    <button onclick="startPuzzleWithPhoto('4.jpg')" class="photo-btn">사진 4</button>
                    <button onclick="startPuzzleWithPhoto('5.jpg')" class="photo-btn">사진 5</button>
                    <button onclick="startPuzzleWithPhoto('6.jpg')" class="photo-btn">사진 6</button>
                    <button onclick="startPuzzleWithPhoto('7.jpg')" class="photo-btn">사진 7</button>
                    <button onclick="startPuzzleWithPhoto('8.jpg')" class="photo-btn">사진 8</button>
                    <button onclick="startPuzzleWithPhoto('9.jpg')" class="photo-btn">사진 9</button>
                    <button onclick="startPuzzleWithPhoto('10.jpg')" class="photo-btn">사진 10</button>
                    <button onclick="startPuzzleWithPhoto('11.jpg')" class="photo-btn">사진 11</button>
                    <button onclick="startPuzzleWithPhoto('12.jpg')" class="photo-btn">사진 12</button>
                    <button onclick="startPuzzleWithPhoto('13.jpg')" class="photo-btn">사진 13</button>
                    <button onclick="startPuzzleWithPhoto('14.jpg')" class="photo-btn">사진 14</button>
                    <button onclick="startPuzzleWithPhoto('15.jpg')" class="photo-btn">사진 15</button>
                    <button onclick="startPuzzleWithPhoto('16.jpg')" class="photo-btn">사진 16</button>
                    <button onclick="startPuzzleWithPhoto('17.jpg')" class="photo-btn">사진 17</button>
                    <button onclick="startPuzzleWithPhoto('18.jpg')" class="photo-btn">사진 18</button>
                    <button onclick="startPuzzleWithPhoto('19.jpg')" class="photo-btn">사진 19</button>
                    <button onclick="startPuzzleWithPhoto('20.jpg')" class="photo-btn">사진 20</button>
                    <button onclick="startPuzzleWithPhoto('21.jpg')" class="photo-btn">사진 21</button>
                    <button onclick="startPuzzleWithPhoto('22.jpg')" class="photo-btn">사진 22</button>
                </div>
            </div>

            <!-- 실제 퍼즐 맞추기 판 (원본 사진 + 퍼즐판 좌우 나란히 배치) -->
            <div id="puzzle-game-area" style="display: none;">
                <p id="puzzle-instruction" style="font-size: 14px; color: #555;">조각을 두 개씩 클릭하여 자리를 바꿔보세요!</p>
                
                <!-- 원본 사진과 퍼즐판을 감싸는 좌우 정렬 박스 -->
                <div class="puzzle-flex-container" style="display: flex; justify-content: center; align-items: center; gap: 20px; flex-wrap: wrap; margin: 15px 0;">
                    <!-- 왼쪽: 원본 사진 비교용 -->
                    <div style="background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                        <p style="margin: 0 0 5px 0; font-size: 13px; font-weight: bold; color: #555;">📸 원본 사진</p>
                        <img id="puzzle-original-img" src="" alt="원본 사진" style="width: 120px; height: 120px; object-fit: cover; border-radius: 4px; border: 2px solid #ccc;">
                    </div>
                    
                    <!-- 오른쪽: 퍼즐 판 -->
                    <div id="puzzle-board" style="display: grid; grid-template-columns: repeat(3, 100px); grid-template-rows: repeat(3, 100px); gap: 2px; background: #333; padding: 2px; border-radius: 4px;"></div>
                </div>

                <p id="puzzle-status" style="font-weight: bold; color: #28a745; height: 20px;"></p>
                <button onclick="backToPhotoSelect()" style="background: #17a2b8; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin-top: 5px;">🖼️ 다른 사진 고르기</button>
            </div>
            
            <br>
            <button onclick="goLobby()" style="margin-top: 10px; background: #6c757d; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">🏠 로비로 돌아가기</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
